:root{
  --ink:#16161d; --paper:#f7f4ee; --rim:#ffffff; --verm:#ee5a2c; --lilac:#c9cdea;
  --sky: linear-gradient(180deg,#aebbe8 0%,#cfd2ee 36%,#f1dccf 74%,#f8cbab 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#cfd2ee}
body{font-family:"Scory Serif",Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#track{height:1000vh}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--sky);contain:strict;--fg:var(--ink);color:var(--fg)}
.t{position:absolute;left:0;top:0;will-change:transform}
canvas.cloud{pointer-events:none}
.sh{position:absolute;inset:11% 6% 7%;background:rgba(28,24,64,.78);box-shadow:0 0 26px 16px rgba(28,24,64,.78);border-radius:14px;z-index:-1;will-change:transform;pointer-events:none}
.lift{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.25)}
.paper:hover .lift{transform:translateY(-5px) rotate(-.7deg) scale(1.012)}
.paper svg{display:block;overflow:visible}
.paper .inner{position:absolute;inset:0;pointer-events:none}
.spec{position:absolute;left:9%;top:16%;font-size:clamp(11px,1.05vw,15px);letter-spacing:.02em;opacity:.62;line-height:1.5;white-space:nowrap}
.spec b{display:block;font-weight:400;font-size:clamp(34px,6vw,92px);line-height:1;letter-spacing:-.02em;margin-top:.12em;color:transparent;-webkit-text-stroke:1px var(--ink)}
.letter svg,.dot svg{display:block;overflow:visible}
.letter{pointer-events:none}
.letter path{fill:none;stroke:var(--ink);stroke-width:var(--sw,2);stroke-linejoin:round;pointer-events:all;transition:stroke-width .3s}
.letter path:hover{stroke-width:calc(var(--sw,2) * 2.4)}
.dot{pointer-events:none}
.dot.last path{fill:var(--fg);stroke:var(--fg)}
#stage.intro .letter path{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 1.7s cubic-bezier(.6,0,.2,1) calc(var(--n) * .1s + .15s) forwards}
#stage.intro #hero h1,#stage.intro #hero p{animation:rise .9s ease-out both}
#stage.intro #hero p{animation-delay:.15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#fx{position:absolute;inset:0;z-index:39;pointer-events:none}
#scrim{width:100%;height:100%;z-index:2;pointer-events:none;background:radial-gradient(ellipse 62% 70% at 24% 42%,rgba(14,16,58,.62),rgba(14,16,58,.3) 55%,rgba(14,16,58,0) 100%)}
#glow{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 85% 62% at 50% 104%,rgba(255,196,126,.8),rgba(255,150,112,.34) 42%,rgba(255,140,120,0) 74%)}
#tint{position:absolute;inset:0;z-index:33;background:#0a0c28;opacity:0;pointer-events:none}
.dot path{fill:var(--fg);stroke:var(--fg);stroke-width:1.25;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#hero{max-width:min(86vw,36rem)}
#hero h1{font-weight:400;font-size:clamp(46px,7.4vw,112px);line-height:.95;letter-spacing:-.035em}
#hero p{margin-top:1.1em;font-size:clamp(16px,1.45vw,21px);line-height:1.4;max-width:21em}
#nav{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;padding:clamp(18px,2.6vw,34px) clamp(20px,6vw,88px);font-size:clamp(14px,1.1vw,17px);z-index:50}
#nav span+span{margin-left:1.6em}
#hint{font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:.8em}
#hint i{display:block;width:1px;height:34px;background:var(--ink);transform-origin:top;animation:drip 2.2s cubic-bezier(.6,0,.2,1) infinite}
@keyframes drip{0%{transform:scaleY(0)}55%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.card{color:var(--ink)}
#mark,#colophon,#nav,#contact{color:var(--fg)}
.card .inner{position:absolute;inset:0;padding:var(--pad);display:flex;flex-direction:column}
.card .no{font-size:12px;letter-spacing:.1em;opacity:.55}
.card h2{font-weight:400;font-size:var(--T);line-height:1.02;letter-spacing:-.02em;margin-top:auto;padding-left:var(--ind)}
.card{cursor:pointer}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.card .more{padding-left:var(--ind);margin-top:.55em;font-size:clamp(12px,.95vw,14px);text-decoration:underline;text-underline-offset:.22em;text-decoration-thickness:1px}
.card:hover .more{text-decoration-thickness:2px}
#detail{outline:none;position:absolute;inset:0;z-index:47;overflow-y:auto;visibility:hidden;pointer-events:none;color:var(--ink);opacity:0;transition:opacity .35s ease,visibility 0s .35s}
#detail.open{visibility:visible;pointer-events:auto;opacity:1;transition:opacity .5s ease .12s}
#detail .wrap{min-height:100%;max-width:1180px;padding:clamp(78px,13vh,130px) clamp(20px,6.5vw,96px) clamp(26px,5vh,54px);display:flex;flex-direction:column}
#detail button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:.22em;text-decoration-thickness:1px;font-size:clamp(14px,1.1vw,17px)}
#detail button:hover{text-decoration-thickness:2px}
#detail .back{align-self:flex-start}
#detail .idx{margin-top:clamp(16px,4vh,40px);font-size:13px;letter-spacing:.1em;opacity:.6}
#detail h2{font-weight:400;font-size:var(--Ft);line-height:.98;letter-spacing:-.03em;margin-top:.14em;padding-left:.46em}
#detail .slot{display:inline-block;width:0;height:0;vertical-align:baseline}
#detail .lead{font-size:clamp(18px,1.9vw,27px);line-height:1.36;max-width:27em;margin-top:.9em}
#detail dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.6vw,40px);margin-top:clamp(22px,4.5vh,48px);max-width:58rem}
#detail dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
#detail dd{font-size:clamp(15px,1.25vw,18px);line-height:1.36;margin-top:.35em}
#detail .credit{margin-top:clamp(16px,3vh,30px);font-size:clamp(13px,1.05vw,16px);line-height:1.45;opacity:.78;max-width:46rem}
#detail .credit p+p{margin-top:.3em}
#club{width:min(88vw,47rem);color:var(--fg)}
#club .kick{font-size:13px;letter-spacing:.1em;opacity:.65}
#club h2{font-weight:400;font-size:var(--Fc);line-height:.98;letter-spacing:-.03em;margin-top:.12em;padding-left:.46em}
#club .slot{display:inline-block;width:0;height:0;vertical-align:baseline}
#club .lead{font-size:clamp(17px,1.85vw,26px);line-height:1.36;max-width:27em;margin-top:.85em}
#club dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.2vw,30px) clamp(16px,3vw,48px);margin-top:clamp(18px,4vh,42px)}
#club dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
#club dd{font-size:clamp(14px,1.2vw,18px);line-height:1.36;margin-top:.3em}
#club .btn{display:inline-block;margin-top:clamp(18px,4vh,40px);padding:.72em 1.3em;border-radius:999px;background:var(--fg);color:var(--ink);text-decoration:none;font-size:clamp(15px,1.2vw,18px);transition:transform .25s cubic-bezier(.2,.9,.25,1.3)}
#club .btn:hover{transform:translateY(-2px)}
@media (max-width:700px){#club dl{grid-template-columns:1fr;gap:10px}}
#about{width:min(86vw,35rem);font-size:clamp(20px,2.25vw,33px);line-height:1.27;letter-spacing:-.01em}
#contact{font-size:clamp(18px,2vw,28px);white-space:nowrap;text-align:center}
#contact .pre{font-size:clamp(14px,1.2vw,18px);opacity:.75;margin-bottom:.45em}
#bridge1{width:min(86vw,35rem);font-size:clamp(20px,2.25vw,33px);line-height:1.27;letter-spacing:-.01em}
#bridge2{width:min(88vw,46rem);font-size:var(--Fb);line-height:1.16;letter-spacing:-.02em;color:var(--fg)}
#bridge2 p{padding-left:.62em}
#bridge2 .slot{display:inline-block;width:0;height:0;vertical-align:baseline}
#contact a{color:var(--fg);text-underline-offset:.2em;text-decoration-thickness:1px}
#contact a:hover{text-decoration-thickness:2px}
#detail .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(22px,4.5vh,44px)}
#detail .acts a{display:inline-block;padding:.72em 1.3em;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:clamp(15px,1.2vw,18px);transition:transform .25s cubic-bezier(.2,.9,.25,1.3)}
#detail .acts a+a{background:transparent;color:var(--ink)}
#detail .acts a:hover{transform:translateY(-2px)}
#detail .foot{margin-top:auto;padding-top:clamp(26px,6vh,56px);display:flex;justify-content:space-between;gap:20px}
#detail .wrap{position:relative}
#detail .wrap.has-shots{max-width:none}
#detail .shots{position:absolute;right:clamp(20px,5.5vw,84px);top:clamp(112px,18vh,180px);width:var(--Ws);height:var(--Hs);cursor:pointer;-webkit-tap-highlight-color:transparent}
#detail .shot::before{content:"";position:absolute;inset:9% 5% 5%;border-radius:12px;background:rgba(24,20,60,.3);box-shadow:0 12px 28px 14px rgba(24,20,60,.3);z-index:-1}
#detail .shot{position:absolute;left:0;top:0;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.2,.9,.25,1.12);will-change:transform}
#detail .shot svg{display:block}
#detail .shots .tip{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:13px;letter-spacing:.06em;opacity:.6;pointer-events:none}
#detail .shots:focus-visible{outline:2px solid var(--ink);outline-offset:10px}
@media (min-width:861px){#detail .wrap.has-shots h2{max-width:46vw}#detail .wrap.has-shots .foot{justify-content:flex-start}#detail .wrap.has-shots .foot span{display:none}#detail .wrap.has-shots .lead{max-width:min(27em,43vw)}#detail .wrap.has-shots dl,#detail .wrap.has-shots .credit{max-width:43vw}}
@media (max-width:860px){#detail .shots{position:relative;right:auto;top:auto;margin:26px auto 6px}}
#detail .wrap.in>*{animation:fadein .55s ease both}
#detail .wrap.in>.shots{animation:none}
#detail .wrap.in>*:nth-child(3){animation-delay:.05s}#detail .wrap.in>*:nth-child(4){animation-delay:.1s}#detail .wrap.in>*:nth-child(5){animation-delay:.15s}#detail .wrap.in>*:nth-child(6){animation-delay:.2s}#detail .wrap.in>*:nth-child(7){animation-delay:.25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (max-width:700px){#detail dl{grid-template-columns:1fr;gap:14px}}
#cap{font-size:clamp(13px,1.05vw,16px);white-space:nowrap}
#cap a{color:inherit;text-underline-offset:.22em}
#nav a{color:inherit;text-decoration:none}
#nav a+a,#nav a+span,#nav span+a{margin-left:1.6em}
.card p{font-size:clamp(13px,1.05vw,16px);line-height:1.35;margin-top:.5em;padding-left:var(--ind);opacity:.78;max-width:19em}
#mark{white-space:nowrap;font-size:var(--F);line-height:1;letter-spacing:-.03em}
#mark .gap{display:inline-block;width:.236em;height:0;vertical-align:baseline}
#colophon{font-size:clamp(13px,1.05vw,16px);opacity:.7;text-align:center;white-space:nowrap}
#grain{position:absolute;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){#hint i{animation:none}}
</style>

/* torn paper outline: walk once around a rounded rectangle and push every point

function tornPath(w,h,seed,inset,amp,step){

  { const Fc=clamp(W*(narrow?.135:.088),44,132); clubEl.style.setProperty("--Fc",Fc+"px"); clubEl.style.transform="none";
    const qx=narrow?W*.06:W*.065, qy=Math.max(narrow?70:96,(H-clubEl.offsetHeight)/2-H*.02), sl=clubEl.querySelector(".slot"), r0=clubEl.getBoundingClientRect(), r1=sl.getBoundingClientRect();
    CLD=Fc*.3; CLX=qx+(r1.left-r0.left)-Fc*.29; CLY=qy+(r1.top-r0.top)-Fc*.245; club.ox=0; club.oy=0;
    club.frames=[[0,{x:qx,y:qy+22,o:0}],[SB+.004,{x:qx,y:qy+22,o:0}],[SB+.05,{x:qx,y:qy,o:1},easeOut],[S2-.045,{x:qx,y:qy,o:1}],[S2+.008,{x:qx,y:qy-16,o:0}]]; }
  /* letters + dots */
  ORDER.forEach((ch,i)=>{
    const gl=G[ch],[dx,dy]=row[i],ang=ANG[ch],dir=(i%2?1:-1);
    const L=letters[ch]; L.el.style.width=(gl.w+160)*k+"px"; L.el.style.height=1140*k+"px"; L.el.style.setProperty("--sw",(1.25/k).toFixed(3)); L.ox=(gl.cx+80)*k; L.oy=(gl.cy+820)*k;
    const a=.075+i*.014;
    L.frames=[[0,{x:dx,y:dy,r:ang,s:1,o:.9}],[a,{x:dx,y:dy,r:ang,s:1,o:.9}],[a+.1,{x:dx,y:dy,r:ang+dir*(34+i*7),s:1.08,o:.75}],[a+.2,{x:dx+dir*W*.16,y:dy-H*.12*(i%3-1),r:ang+dir*(120+i*14),s:1.5,o:0}],[1,{x:dx,y:dy,r:ang,s:1,o:0}]];
    const D=dots[ch],R=gl.r*1.5; D.el.style.width=D.el.style.height=2*R*k+"px"; D.ox=D.oy=R*k;
    const [bx,by,bt]=bullet[i], sC=dotD/(2*gl.r*k), sE=(F*.092)/(2*gl.r*k), last=ch==="i";
    const dA=.74+i*.01; D.rad=gl.r*k;
    D.frames=[[0,{x:dx,y:dy,r:ang,s:1,o:1}],[.35+i*.02,{x:dx,y:dy,r:ang,s:1,o:1}],[bt+.035,{x:bx,y:by,r:0,s:sC,o:1},back],[dA,{x:bx,y:by,r:0,s:sC,o:1}]]
      .concat(last?[[.875,{x:BRX,y:BRY,r:0,s:BRD/(2*gl.r*k),o:1}],[.965,{x:dotX,y:dotY,r:0,s:sE,o:1},softBack],[1,{x:dotX,y:dotY,r:0,s:sE,o:1}]]
                  :[[.80,{x:lerp(bx,dotX,.3),y:lerp(by,dotY,.3)-H*.07,r:0,s:sC*2.6,o:1},easeOut],[.868,{x:lerp(bx,dotX,.62),y:lerp(by,dotY,.62)-H*.1,r:0,s:0,o:1}],[.872,{x:dotX,y:dotY,r:0,s:0,o:0}]]);
  });

  { /* re-key the last dot from story position to scroll position, then add its stops inside the held beats */
    const D=dots[ORDER[LAST]], gl=G[ORDER[LAST]], f=D.frames.map(fr=>[sOf(fr[0]),fr[1],fr[2]]), n=f.length, sQ=CLD/(2*gl.r*k), atB=f[n-3][1], Q={x:CLX,y:CLY,r:0,s:sQ,o:1};
    D.byS=1; D.frames=f.slice(0,n-3).concat([[S1,atB],[SB-.03,atB],[SB+.035,Q],[S2,Q],f[n-2],f[n-1]]); }
  /* hero copy */
  hero.frames=[[0,{x:narrow?W*.06:W*.065,y:narrow?H*.12:H*.15,o:1}],[.05,{x:narrow?W*.06:W*.065,y:narrow?H*.12:H*.15,o:1}],[.13,{x:narrow?W*.06:W*.065,y:H*.1,o:0}]];
  hint.frames=[[0,{x:narrow?W*.06:W*.065,y:H*.9-34,o:1}],[.03,{x:narrow?W*.06:W*.065,y:H*.9-34,o:0}]];
  for(const key in papers)papers[key].fade=1;
  for(const t of T){t.el.style.transformOrigin=t.ox+"px "+t.oy+"px";t.last=""}
  buildParticles(narrow);
  if(dIdx!=null)measureDetail();
  render(cur);
}

/* ---------- sky, particles, pointer ---------- */
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const SKIES={dawn:["#aebbe8","#cfd2ee","#f1dccf","#f8cbab"],noon:["#7fb2ee","#a9cdf4","#d6e8f8","#f3f7fb"],late:["#86abe6","#bccdea","#f1dfc0","#f8d49c"],golden:["#7c8fd0","#c3b2d2","#f6c79a","#fbb96f"],dusk:["#4f4f9e","#9a68a6","#ee8f6c","#f8c07c"],twilight:["#151a47","#2c2d70","#62467f","#b96a6c"],night:["#080a20","#11153a","#22255c","#39316c"]};
for(const key in SKIES)SKIES[key]=SKIES[key].map(hex);
const SKYK=[[0,"dawn"],[.2,"dawn"],[.46,"noon"],[.58,"noon"],[.66,"late"],[.725,"golden"],[.785,"dusk"],[.86,"twilight"],[.876,"twilight"],[.955,"night"]];
const INK=[22,22,29], LIGHT=[246,241,228], STAR=[255,246,224];
const mix=(a,b,t)=>[0,1,2].map(i=>Math.round(lerp(a[i],b[i],t)));
const tint=document.getElementById("tint"); let skyStr="",fgStr="",lastSky=-9,lastTint="",lastGlow="";
const glow=document.getElementById("glow");
function sky(p){
  p=lerp(p,.6,dMix); if(Math.abs(p-lastSky)<.0015)return; lastSky=p;
  let i=1; while(i<SKYK.length-1&&SKYK[i][0]<p)i++; const A=SKYK[i-1],B=SKYK[i],u0=clamp((p-A[0])/(B[0]-A[0]||1),0,1),u=lerp(u0,sstep(0,1,u0),.55);
  const c=SKIES[A[1]].map((ca,n)=>"rgb("+mix(ca,SKIES[B[1]][n],u).join(",")+")");
  const str=`linear-gradient(180deg,${c[0]} 0%,${c[1]} 36%,${c[2]} 74%,${c[3]} 100%)`;
  if(str!==skyStr){stage.style.background=str;skyStr=str}
  const fg="rgb("+mix(INK,LIGHT,sstep(.795,.855,p)).join(",")+")"; if(fg!==fgStr){stage.style.setProperty("--fg",fg);fgStr=fg}
  const tv=(sstep(.88,.955,p)*.5).toFixed(2); if(tv!==lastTint){tint.style.opacity=tv;lastTint=tv}
  const gv=(sstep(.6,.76,p)*(1-sstep(.8,.95,p)*.92)).toFixed(2); if(gv!==lastGlow){glow.style.opacity=gv;lastGlow=gv}
}

function buildParticles(narrow){
  const per=narrow?60:115, r=rng(77); PT=[];
  ORDER.forEach((ch,i)=>{for(let n=0;n<per;n++){const a=r()*6.283,rad=Math.sqrt(r())*.82;
    PT.push({i,ox:Math.cos(a)*rad,oy:Math.sin(a)*rad,c:Math.floor(r()*3),cu:.5+(r()-.5)*.56,cv:.52+(r()-.5)*.3,d:r()*1.25,du:.85+r()*.55,bend:(r()-.5)*.7,
      sx:r(),sy:Math.pow(r(),1.5)*.8,ss:.5+r()*1.2,ph:r()*6.283,sp:.5+r()*1.7,pj:.775+r()*.05,pd:.03+r()*.02,per});}});
  for(const q of PT){ if(q.i===LAST)continue; const v=sample(dots[ORDER[q.i]],q.pj), rr=dots[ORDER[q.i]].rad*(v.s??1); q.x0=v.x+q.ox*rr; q.y0=v.y+q.oy*rr; }
  const dpr=1; fx.width=W*dpr; fx.height=H*dpr; fx.style.width=W+"px"; fx.style.height=H+"px"; fc.setTransform(dpr,0,0,dpr,0,0);
}
const fx=document.getElementById("fx"), fc=fx.getContext("2d");
const intro={on:false,t0:0,m:[1,1,1,1,1,1]}; let fxDirty=false;
function bez(ax,ay,bx,by,bend,e){const mx=(ax+bx)/2-(by-ay)*bend,my=(ay+by)/2+(bx-ax)*bend,f=1-e;return [f*f*ax+2*f*e*mx+e*e*bx, f*f*ay+2*f*e*my+e*e*by]}
function drawParticles(p,now){
  fc.clearRect(0,0,W,H); fxDirty=true;
  if(intro.on){
    const tau=(now-intro.t0)/1000, arrived=[0,0,0,0,0,0], cp=clouds.map(c=>sample(c,p));
    for(const q of PT){
      const u=(tau-q.d)/q.du, A=cp[q.c], ax=A.x+q.cu*CDIM[q.c][0], ay=A.y+q.cv*CDIM[q.c][1];
      if(u>=1){arrived[q.i]++;continue}
      const rad=dots[ORDER[q.i]].rad, bx=ROW[q.i][0]+q.ox*rad, by=ROW[q.i][1]+q.oy*rad, e=u<=0?0:ease(u), pt=bez(ax,ay,bx,by,q.bend,e);
      const c=mix(STAR,INK,sstep(.25,.75,e)); fc.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${u<=0?.85:1})`;
      fc.beginPath(); fc.arc(pt[0],pt[1],lerp(1.5,2.6,e),0,6.283); fc.fill();
    }
    for(let i=0;i<6;i++)intro.m[i]=Math.pow(arrived[i]/PT[0].per,.6);
    if(tau>2.75){intro.on=false;intro.m=[1,1,1,1,1,1];stage.classList.remove("intro")}
    return;
  }
  const tw=now/1000, lastA=sstep(.9,.975,p);
  for(const q of PT){
    const ex=q.sx*W, ey=q.sy*H; let x,y,rad,al,c=STAR;
    if(q.i===LAST){ if(lastA<=0)continue; x=ex;y=ey;rad=q.ss;al=lastA*(.62+.38*Math.sin(tw*q.sp+q.ph)); }
    else{ const u=(p-q.pj)/q.pd; if(u<=0)continue; const e=easeOut(Math.min(1,u)), pt=bez(q.x0,q.y0,ex,ey,q.bend*.5,e); x=pt[0];y=pt[1];
      rad=lerp(2.3,q.ss,e); c=mix(INK,STAR,sstep(0,.45,u)); al=u<1?1:lerp(1,.62+.38*Math.sin(tw*q.sp+q.ph),Math.min(1,(u-1)*3)); }
    fc.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${al.toFixed(3)})`; fc.beginPath(); fc.arc(x,y,rad,0,6.283); fc.fill();
  }
}

let mxT=0,myT=0,mx=0,my=0,ptx=-9999,pty=-9999,pushActive=false;
addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return; mxT=e.clientX/W*2-1; myT=e.clientY/H*2-1; ptx=e.clientX; pty=e.clientY; ptrMoved=performance.now()},{passive:true});
document.addEventListener("pointerleave",()=>{ptx=pty=-9999;mxT=myT=0});

/* ---------- scroll engine ----------
   Scroll position s runs 0..1. The story position p follows it, except for one held stop
   (the QDSAC page) where p waits while s keeps moving. */
const HOLD_P=.875,S1=.63,SB=.735,S2=.87;
const storyP=s=>s<=S1?s/S1*HOLD_P:s<=S2?HOLD_P:HOLD_P+(s-S2)/(1-S2)*(1-HOLD_P);
const sOf=p=>p<=HOLD_P?p/HOLD_P*S1:S2+(p-HOLD_P)/(1-HOLD_P)*(1-S2);
function sample(t,p){
  const f=t.frames; if(p<=f[0][0])return f[0][1]; const n=f.length; if(p>=f[n-1][0])return f[n-1][1];
  let i=1; while(f[i][0]<p)i++; const A=f[i-1],B=f[i]; let u=(p-A[0])/(B[0]-A[0]||1); u=t.lin?u:(B[2]||ease)(u);
  const a=A[1],b=B[1],o={}; for(const key in b)o[key]=lerp(a[key]??b[key],b[key],u); return o;
}
function render(s){
  const p=storyP(s); sky(p); pushActive=false;
  if(dMix!==lastDM){fx.style.opacity=(1-dMix).toFixed(3);lastDM=dMix}
  for(const t of T){ if(!t.frames.length)continue; const v=sample(t,t.byS?s:p); let o=v.o??1, rot=v.r||0;
    if(t.fade)o*=1-dMix;
    const h=v.h||0; let x=v.x-mx*t.dp, y=v.y-my*t.dp, sc=(v.s??1)*(1+h*.035);
    if(t.dot!=null){
      const want=(dIdx===t.dot&&dT===1)?1:0; if(Math.abs(want-t.dm)>.002){t.dm+=(want-t.dm)*.12;pushActive=true}else t.dm=want;
      if(t.dm>0||dMix>0){const e=ease(t.dm); o=lerp(o*(1-dMix),1,e); x=lerp(x,DX,e); y=lerp(y,DY,e); sc=lerp(sc,DD/(2*t.rad),e); rot=lerp(rot,0,e)}
    }
    if(o<.004){ if(t.vis!==0){t.el.style.visibility="hidden";t.vis=0} continue }
    if(t.vis!==1){t.el.style.visibility="visible";t.vis=1}
    if(t.dot!=null){
      sc*=intro.m[t.dot];
      const dx=x-ptx, dy=y-pty, dist=Math.hypot(dx,dy), R=Math.max(90,t.rad*3.4); let tx=0,ty=0;
      if(dist<R&&dist>.01){const f=Math.pow(1-dist/R,2)*Math.max(22,t.rad*1.2*Math.min(1,(v.s??1)+.35)); tx=dx/dist*f; ty=dy/dist*f}
      t.px+=(tx-t.px)*.16; t.py+=(ty-t.py)*.16; if(Math.abs(tx-t.px)+Math.abs(ty-t.py)>.05)pushActive=true; x+=t.px; y+=t.py;
    }
    const tf=`translate3d(${(x-t.ox).toFixed(1)}px,${(y-t.oy).toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    if(tf!==t.last){t.el.style.transform=tf;t.last=tf}
    const os=o.toFixed(3); if(os!==t.lo){t.el.style.opacity=os;t.lo=os}
    if(t.sh&&h!==t.lh){t.lh=h;const d=7+h*46, q=rot*Math.PI/180; t.sh.style.transform=`translate(${(d*Math.sin(q)).toFixed(1)}px,${(d*Math.cos(q)).toFixed(1)}px) scale(${(1+h*.07).toFixed(3)})`; t.sh.style.opacity=(.4-h*.22).toFixed(3)}
  }
}
let cur=0,target=0,lastDM=-1,ptrMoved=0;

/* ---------- project intro (opens over the sky) ---------- */
let dIdx=null,dT=0,dMix=0,DX=0,DY=0,DD=10;
const detEl=document.getElementById("detail"), wrapEl=detEl.querySelector(".wrap");
let shotOrder=[],shotPose=[],flipping=false;
function poseShots(pre){
  wrapEl.querySelectorAll(".shot").forEach(el=>{const k=+el.dataset.k, pos=shotOrder.indexOf(k), q=shotPose[pos];
    el.style.zIndex=10-pos; el.style.transitionDelay=pre?"0s":(.12+pos*.09)+"s";
    el.style.transform=pre?`translate(${W*.7}px,${q[1]+H*.12}px) rotate(${q[2]+22}deg)`:`translate(${q[0]}px,${q[1]}px) rotate(${q[2]}deg)`;
    if(pre){el.style.transition="none";void el.offsetWidth;el.style.transition=""}});
}
function flipShots(){
  if(flipping||shotOrder.length<2)return; flipping=true;
  const top=wrapEl.querySelector('.shot[data-k="'+shotOrder[0]+'"]'), q=shotPose[0], w=parseFloat(getComputedStyle(wrapEl).getPropertyValue("--Ws"));
  top.style.transitionDelay="0s"; top.style.transform=`translate(${q[0]+w*.78}px,${q[1]-w*.08}px) rotate(${q[2]+13}deg)`;
  setTimeout(()=>{shotOrder.push(shotOrder.shift()); wrapEl.querySelectorAll(".shot").forEach(el=>{const pos=shotOrder.indexOf(+el.dataset.k),p=shotPose[pos];el.style.zIndex=10-pos;el.style.transitionDelay="0s";el.style.transform=`translate(${p[0]}px,${p[1]}px) rotate(${p[2]}deg)`}); setTimeout(()=>flipping=false,380)},330);
}
function measureDetail(){
  const h2=wrapEl.querySelector("h2"), sl=wrapEl.querySelector(".slot"); if(!sl)return;
  const Ft=parseFloat(getComputedStyle(h2).fontSize), r=sl.getBoundingClientRect(); DD=Ft*.3; DX=r.left-Ft*.29; DY=r.top-Ft*.245;
}
function fillDetail(i){
  const p=PROJECTS[i], n=PROJECTS.length, nx=(i+1)%n;
  const hasS=!!(p.shots&&p.shots.length), wide=W>860, nS=hasS?p.shots.length:0, stepK=nS>3?.15:.17, Ws=hasS?(wide?Math.min(W*.42,640,(H*.7)/(.62+stepK*(nS-1))):Math.min(W-2*Math.max(20,W*.065)-8,520)):0;
  wrapEl.classList.toggle("has-shots",hasS);
  wrapEl.style.setProperty("--Ft",clamp(W*(W/H<.85?.125:(hasS?.07:.088)),40,132)+"px");
  let shotsHTML=""; shotOrder=[]; shotPose=[];
  if(hasS){
    const n=p.shots.length, step=Ws*(wide?stepK:(n>3?.2:.25)), rots=[-2.6,3.2,-1.6,2.4], xs=[0,.06,-.045,.04]; let Hs=0;
    shotsHTML=p.shots.map((key,k)=>{const sh=SHOTS[key],h=Math.round(Ws*sh.h/sh.w),amp=Math.max(5,Ws*.012),id="sc"+(uid++);
      const rim=tornPath(Ws,h,31+k*7+i*13,0,amp*.5,8), body=tornPath(Ws,h,38+k*7+i*13,amp*.6,amp*.95,6);
      shotPose.push([xs[k]*Ws,step*k,rots[k]]); shotOrder.push(k); Hs=Math.max(Hs,step*k+h);
      return `<div class="shot" data-k="${k}"><svg width="${Ws}" height="${h}" viewBox="0 0 ${Ws} ${h}"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs><path d="${rim}" fill="#fff"/><image href="${sh.src}" width="${Ws}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/></svg></div>`}).join("");
    wrapEl.style.setProperty("--Ws",Ws+"px"); wrapEl.style.setProperty("--Hs",(Hs+34)+"px");
    shotsHTML=`<div class="shots" role="button" tabindex="0" aria-label="Screenshots of ${p.t}. Press to flip through.">${shotsHTML}<div class="tip">Click to flip through</div></div>`;
  }
  wrapEl.innerHTML=`<button class="back" type="button">Back to all work</button><div class="idx">0${i+1} / 0${n}</div><h2><i class="slot"></i>${p.t}</h2><p class="lead">${p.lead}</p>${wide?"":shotsHTML}<dl>${p.facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join("")}</dl>${p.credit?`<div class="credit">${p.credit.map(c=>`<p>${c}</p>`).join("")}</div>`:""}<div class="acts">${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join("")}</div><div class="foot"><span></span><button class="next" type="button">Next: ${PROJECTS[nx].t}</button></div>${wide?shotsHTML:""}`;
  const st=wrapEl.querySelector(".shots");
  if(st){ poseShots(true); requestAnimationFrame(()=>requestAnimationFrame(()=>poseShots(false)));
    st.addEventListener("click",flipShots); st.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipShots()}}); }
  wrapEl.querySelector(".back").addEventListener("click",closeDetail);
  wrapEl.querySelector(".next").addEventListener("click",()=>openDetail(nx));
  wrapEl.classList.remove("in"); void wrapEl.offsetWidth; wrapEl.classList.add("in"); detEl.scrollTop=0;
}
function openDetail(i){
  if(intro.on)return; dIdx=i; dT=1; fillDetail(i); detEl.classList.add("open"); detEl.setAttribute("aria-hidden","false");
  document.documentElement.style.overflow="hidden"; measureDetail(); pushActive=true;
  detEl.tabIndex=-1; detEl.focus({preventScroll:true});
}
function closeDetail(){
  if(dIdx==null)return; const was=dIdx; dT=0; dIdx=null; detEl.classList.remove("open"); detEl.setAttribute("aria-hidden","true");
  document.documentElement.style.overflow=""; pushActive=true; const c=cards[was]; if(c)c.el.focus({preventScroll:true});
}
detEl.addEventListener("scroll",()=>{measureDetail();pushActive=true},{passive:true});
addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

function readScroll(){const max=document.documentElement.scrollHeight-innerHeight; target=max>0?clamp(scrollY/max,0,1):0}
function tick(now){
  let need=intro.on||pushActive;
  if(intro.on&&target>.012){intro.on=false;intro.m=[1,1,1,1,1,1];stage.classList.remove("intro")}
  const d=target-cur; if(Math.abs(d)>.00002){cur=reduce?target:cur+d*.11;need=true}
  if(Math.abs(mxT-mx)+Math.abs(myT-my)>.0006){mx+=(mxT-mx)*.07;my+=(myT-my)*.07;need=true}
  if(now-ptrMoved<400)need=true;
  if(Math.abs(dT-dMix)>.001){dMix+=(dT-dMix)*.11;need=true}else dMix=dT;
  if(intro.on||storyP(cur)>.76)drawParticles(storyP(cur),now); else if(fxDirty){fc.clearRect(0,0,W,H);fxDirty=false}
  if(need)render(cur);
  requestAnimationFrame(tick);
}
addEventListener("scroll",readScroll,{passive:true});
document.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();closeDetail();const max=document.documentElement.scrollHeight-innerHeight;scrollTo({top:max*({top:0,about:sOf(.31),work:sOf(.67),club:(SB+S2)/2+.01,contact:1})[a.dataset.go],behavior:reduce?"auto":"smooth"})}));
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{layout();readScroll()},120)});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{
  layout();readScroll();cur=target;
  if(!reduce&&target<.012){intro.on=true;intro.t0=performance.now();intro.m=[0,0,0,0,0,0];stage.classList.add("intro")}
  render(cur);requestAnimationFrame(tick)});
window.__detail=i=>{if(i==null)closeDetail();else openDetail(i)};
window.__seek=s=>{intro.on=false;intro.m=[1,1,1,1,1,1];stage.classList.remove("intro");cur=target=s;lastSky=-9;render(s);const p=storyP(s);if(p>.76)drawParticles(p,performance.now());else fc.clearRect(0,0,W,H)};
window.__seekP=p=>__seek(sOf(p));
window.__intro=ms=>{intro.t0=performance.now()-ms};
</script>
